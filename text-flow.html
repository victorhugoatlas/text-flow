<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Flow by VH</title>
    <style>
        :root {
            --cor-fundo: #121212;
            --cor-card: #1e1e1e;
            --cor-texto: #e0e0e0;
            --cor-primaria: #bb86fc;
            --cor-hover: #3700b3;
            --cor-borda: #444;
            --sombra: 0 4px 8px rgba(0, 0, 0, 0.3);
            --transicao: all 0.3s ease-in-out;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: var(--transicao);
        }

        .container {
            background-color: var(--cor-card);
            padding: 30px;
            border-radius: 10px;
            box-shadow: var(--sombra);
            width: 90%;
            max-width: 800px;
            text-align: center;
            transition: var(--transicao);
        }

        h1 {
            color: var(--cor-primaria);
            margin-top: 0;
            margin-bottom: 20px;
        }

        .text-area-group {
            margin-bottom: 20px;
        }

        .text-area-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            text-align: left;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border: 1px solid var(--cor-borda);
            border-radius: 5px;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
            background-color: var(--cor-card);
            color: var(--cor-texto);
            transition: var(--transicao);
        }

        .options-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .options-group label {
            display: flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        
        .options-group input[type="checkbox"] {
            margin-right: 5px;
            accent-color: var(--cor-primaria);
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: var(--cor-primaria);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: var(--transicao);
        }

        button:hover {
            background-color: var(--cor-hover);
        }

        #limparBtn {
            background-color: #dc3545;
        }

        #limparBtn:hover {
            background-color: #c82333;
        }

        footer {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Text Flow by VH</h1>

        <div class="text-area-group">
            <label for="textoOriginal">Digite ou cole seu texto aqui:</label>
            <textarea id="textoOriginal" placeholder="Digite ou cole seu texto aqui..."></textarea>
        </div>

        <div class="options-group">
            <label>
                <input type="checkbox" id="opcaoMinusculo"> Converter para minúsculo
            </label>
            <label>
                <input type="checkbox" id="opcaoMaiusculo"> Converter para maiúsculo
            </label>
            <label>
                <input type="checkbox" id="opcaoSemAcento"> Remover acentos (troca Ç por C)
            </label>
        </div>

        <div class="button-group">
            <button id="processarBtn">Processar Texto</button>
            <button id="limparBtn">Limpar</button>
        </div>
        
        <div class="text-area-group" style="margin-top: 20px;">
            <label for="textoTratado">Texto Processado:</label>
            <textarea id="textoTratado" readonly></textarea>
        </div>
    </div>

    <footer>Text Flow by VH</footer>

    <script>
        const textoOriginal = document.getElementById('textoOriginal');
        const textoTratado = document.getElementById('textoTratado');
        const opcaoMinusculo = document.getElementById('opcaoMinusculo');
        const opcaoMaiusculo = document.getElementById('opcaoMaiusculo');
        const opcaoSemAcento = document.getElementById('opcaoSemAcento');
        const processarBtn = document.getElementById('processarBtn');
        const limparBtn = document.getElementById('limparBtn');

        function removerAcentos(texto) {
            return texto
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/ç/g, "c")
                .replace(/Ç/g, "C");
        }

        processarBtn.addEventListener('click', () => {
            let texto = textoOriginal.value;

            if (opcaoMinusculo.checked) {
                texto = texto.toLowerCase();
            }

            if (opcaoMaiusculo.checked) {
                texto = texto.toUpperCase();
            }

            if (opcaoSemAcento.checked) {
                texto = removerAcentos(texto);
            }

            textoTratado.value = texto;
        });

        limparBtn.addEventListener('click', () => {
            textoOriginal.value = '';
            textoTratado.value = '';
            opcaoMinusculo.checked = false;
            opcaoMaiusculo.checked = false;
            opcaoSemAcento.checked = false;
        });

        opcaoMinusculo.addEventListener('change', () => {
            if (opcaoMinusculo.checked) {
                opcaoMaiusculo.checked = false;
            }
        });

        opcaoMaiusculo.addEventListener('change', () => {
            if (opcaoMaiusculo.checked) {
                opcaoMinusculo.checked = false;
            }
        });
    </script>
</body>
</html>
